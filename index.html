<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Zoom-Bilderquiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🔍 Zoom-Bilderquiz</h1>
    <div class="scoreboard" id="scoreboard"></div>
  </header>

  <main>
    <section id="setup">
      <div class="card">
        <h2>1. Teams</h2>
        <div id="teamList" class="team-list"></div>
        <button class="btn" id="btnAddTeam">➕ Team hinzufügen</button>
      </div>

      <div class="card">
        <h2>2. Wie viele Bilder?</h2>
        <div class="rounds" id="roundChoice"></div>
      </div>

      <div class="card">
        <h2>3. Kategorie wählen &amp; los!</h2>
        <div id="categories" class="categories"></div>
        <p id="loadError" class="error" hidden></p>
      </div>

      <div class="card">
        <button class="btn" id="btnShowAlltime">🏆 Ewige Rangliste ansehen</button>
      </div>
    </section>

    <section id="game" hidden>
      <div class="topline">
        <span id="categoryLabel" class="pill"></span>
        <span id="roundLabel" class="round-label"></span>
        <span class="stages" id="stages"></span>
        <button class="btn present-btn" id="btnPresent" title="Präsentationsmodus (Taste F)">⛶ Präsentation</button>
      </div>

      <div class="frame" id="frame">
        <img id="picture" alt="Quizbild">
        <div class="loading" id="loading">Bild wird gesucht …</div>
        <div class="answer" id="answer" hidden></div>
      </div>

      <div class="timer"><div class="timer-bar" id="timerBar"></div></div>

      <div class="controls" id="guessControls">
        <button class="btn big primary" id="btnGuess">🙋 Ich weiß es!</button>
      </div>
      <div class="controls" id="judgeControls" hidden>
        <p class="hint">Wer hat's gewusst? <span id="pointsHint" class="points-hint"></span></p>
        <div class="team-picks" id="teamPicks"></div>
        <div class="controls">
          <button class="btn big primary" id="btnAward">✔️ Punkte vergeben</button>
          <button class="btn big" id="btnNobody">🤷 Niemand</button>
        </div>
      </div>
      <div class="controls" id="nextControls" hidden>
        <button class="btn big primary" id="btnNext">➡️ Nächstes Bild</button>
        <button class="btn" id="btnEnd">🏁 Spiel beenden</button>
      </div>
      <p class="credit" id="credit"></p>
    </section>

    <section id="ranking" hidden>
      <div class="card" id="gameRankingCard">
        <h2>🏆 Rangliste – dieses Spiel</h2>
        <ol class="ranking" id="gameRanking"></ol>
      </div>
      <div class="card">
        <h2>⭐ Ewige Rangliste</h2>
        <table class="alltime">
          <thead><tr><th>#</th><th>Team</th><th>Punkte</th><th>Siege</th><th>Spiele</th></tr></thead>
          <tbody id="alltimeRanking"></tbody>
        </table>
        <p class="hint-small" id="alltimeEmpty" hidden>Noch keine Spiele gespeichert.</p>
      </div>
      <div class="controls">
        <button class="btn big primary" id="btnAgain">🔁 Neues Spiel</button>
        <button class="btn" id="btnResetAlltime">Ewige Rangliste löschen</button>
      </div>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
